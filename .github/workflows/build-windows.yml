name: Build Windows VST3

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # only used to attach the zip to a GitHub Release on v* tags

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Configure (x64, Visual Studio)
        run: cmake -B build -A x64 -DPHASECHECK_BUILD_TESTS=ON

      - name: Build Release (VST3, Standalone, tests)
        run: cmake --build build --config Release --parallel

      - name: Unit tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: pluginval (strictness 8)
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Windows.zip -OutFile pluginval.zip
          Expand-Archive pluginval.zip -DestinationPath pluginval -Force
          $vst3 = "build\PhaseCheck_artefacts\Release\VST3\Phase Check.vst3"
          .\pluginval\pluginval.exe --strictness-level 8 --verbose --timeout-ms 600000 --output-dir pluginval-logs --validate "$vst3"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package | Out-Null
          Copy-Item -Recurse "build\PhaseCheck_artefacts\Release\VST3\Phase Check.vst3" package\
          Copy-Item "build\PhaseCheck_artefacts\Release\Standalone\Phase Check.exe" package\
          Copy-Item README.md package\
          Copy-Item -Recurse Resources\Fonts\*.txt package\
          Compress-Archive -Path package\* -DestinationPath PhaseCheck-Windows-x64.zip -Force

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: PhaseCheck-Windows-x64
          path: package/

      - name: Upload pluginval logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pluginval-logs
          path: pluginval-logs/
          if-no-files-found: ignore

      - name: Commit the built plug-in into Builds/Windows (main only)
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          $dest = "Builds\Windows"
          if (Test-Path $dest) { Remove-Item -Recurse -Force $dest }
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Copy-Item -Recurse "build\PhaseCheck_artefacts\Release\VST3\Phase Check.vst3" $dest\
          Copy-Item PhaseCheck-Windows-x64.zip $dest\
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f $dest
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "Windows VST3 build from ${{ github.sha }} [skip ci]"
            git push origin HEAD:main
          }
          exit 0

      - name: Attach to GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: PhaseCheck-Windows-x64.zip
